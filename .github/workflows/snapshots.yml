# Pre-kickoff split snapshots, every 10 minutes in the window before each kickoff slot.
# Cron is UTC. Each slot is listed for both EDT (UTC-4) and EST (UTC-5); the off-season
# copy just takes extra snapshots after kickoff. A coverage check fails the run (red X + email)
# when a game kicked off without a DraftKings snapshot in its last 90 minutes.
# Output goes to the separate `snapshots` branch (one commit, force-pushed), never to main,
# so GitHub Pages (served from main) never serves or links it.
name: split-snapshots
on:
  workflow_dispatch:
    inputs:
      alert_test:
        description: 'Open one [TEST] line-move issue (no state change)'
        default: '0'
  schedule:
    # Every 10 minutes through the ~90+ minutes before each kickoff slot, in both EDT and EST (UTC).
    # GitHub delays or drops scheduled runs under load (Oct 11: nothing ran 13:10-17:58 UTC), so
    # one or two runs per slot is not enough. Off-the-hour minutes avoid the busiest start times.
    # Mid-week line-move checks (card posts Tue; Thu/Sun games need alerts before the kickoff window).
    # Sparse on purpose to save Actions minutes; kickoff windows stay dense.
    - cron: '17 15,21 * * 2'                   # Tue 10:17 AM / 4:17 PM CT
    - cron: '17 14,17,20,23 * * 3'              # Wed ~9 AM, noon, 3 PM, 6 PM CT
    - cron: '17 14,17,20 * * 4'                 # Thu daytime before evening kickoff window
    - cron: '3,13,23,33,43,53 22,23 * * 4'      # Thu 8:15 PM ET
    - cron: '3,13,23,33,43,53 0,1 * * 5'
    - cron: '3,13,23,33,43,53 11-23 * * 0'      # Sun 9:30 AM, 1:00, 4:05/4:25, 8:20 PM ET
    - cron: '30 15,16 * * 0'                    # Sun ~10:30 AM CT morning pull for the early games (CDT 15:30 UTC, CST 16:30 UTC)
    - cron: '3,13,23,33,43,53 0,1 * * 1'
    - cron: '3,13,23,33,43,53 22,23 * * 1'      # Mon 8:15 PM ET
    - cron: '3,13,23,33,43,53 0,1 * * 2'
    # Non-standard slots (Saturday games, Friday international/Brazil, any odd kickoff): every 10 min
    # all day Fri/Sat UTC (+ early Sat/Sun UTC for Fri/Sat night games), gated by scripts/kick_gate.py
    # so only runs within 75 min of an ESPN-listed kickoff actually pull. Gated crons end in 8.
    - cron: '8,18,28,38,48,58 * * * 5,6'
    - cron: '8,18,28,38,48,58 0-4 * * 0'
permissions:
  contents: write
  issues: write
concurrency:
  group: split-snapshots
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            data
      - name: Kickoff gate (only the Fri/Sat catch-all crons; standard slots always run)
        id: gate
        run: |
          case "${{ github.event.schedule }}" in
            8,18,28,38,48,58*) python3 scripts/kick_gate.py ;;
            *) echo run=1 >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Restore existing snapshots
        if: steps.gate.outputs.run == '1'
        run: |
          mkdir -p out
          if git fetch --depth=1 origin snapshots 2>/dev/null; then
            git --work-tree=out checkout FETCH_HEAD -- snapshots 2>/dev/null || true
          fi
          mkdir -p out/snapshots
      - name: Take snapshot
        if: steps.gate.outputs.run == '1'
        run: python3 scripts/snapshot.py out/snapshots
      - name: Line-move alerts (GitHub issue, label line-move)
        if: always() && steps.gate.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TEST: ${{ github.event.inputs.alert_test || '0' }}
        run: |
          gh label create line-move --color D4A017 --description "DraftKings line moved on a posted play" 2>/dev/null || true
          python3 scripts/line_alerts.py out/snapshots data/current_card.json
      - name: Save to snapshots branch (single commit, every pull kept, never pruned)
        if: always() && steps.gate.outputs.run == '1'
        run: |
          cd out
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -q -m "snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshots
      - name: Coverage check (fails loudly on a pre-kickoff gap)
        if: steps.gate.outputs.run == '1'
        run: python3 scripts/check_coverage.py out/snapshots
